<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Image Card</title>
  </head>
  <body>
    <div id="container">
      <!--will hold the card-->
      <div class="card">
        <!--div for the card-->
        <img src="tools/cat-in-glasses.jpeg" alt="cat-in-glasses" />

      <div class="details">
        <!--for the deatils-->
        <span class="tag">A cat</span>
        <span class="tag">Wearing glasses</span>
      </div>

      <div class="name">A cat in glasses</div>
      <p>
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aliquam,

        molestiae rem blanditiis suscipit eum nisi doloremque libero? Aspernatur
        praesentium eaque nihil.

    </div>
    <button>More info.</button>
  </body>
</html>
